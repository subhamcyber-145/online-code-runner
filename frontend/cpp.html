<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>C++ Runner</title>

    <link rel="stylesheet"
    href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

</head>

<body>

    <div class="editor-layout">

        <div class="sidebar">

            <div class="sidebar-icon">

                C++

            </div>

            <a
            href="index.html"

            class="sidebar-home">

                🏠

            </a>

        </div>

        <div class="main-editor">

            <div class="topbar">

                <span>

                    C++ Runner

                </span>

                <div id="execution-status">

                  Idle

                </div>

                <div class="topbar-buttons">

                    <button
                    id="run-btn"

                    onclick="runCode()">

                        ▶ Run

                    </button>

                    <button
                    id="save-btn"

                    onclick="saveFile()">

                        Save

                    </button>

                </div>

            </div>

<div class="editor-tabs">

    <a href="python.html"
    class="tab-link">

        Python

    </a>

    <a href="javascript.html"
    class="tab-link">

        JavaScript

    </a>

    <a href="cpp.html"
    class="tab-link active-tab">

        C++

    </a>

    <a href="visual.html"
    class="tab-link">

        Visual

    </a>

</div>

            <div id="editor"></div>

            <div id="editor-loading">

              Loading editor...

            </div>

            <div id="output-container">

                <div class="terminal-header">

                    TERMINAL

                </div>

                <pre id="output">
Ready.

Press Ctrl + Enter to run code.
                </pre>

            </div>

        </div>

    </div>

    <script src="editor-core.js"></script>

    <script src="cpp.js"></script>

</body>

</html>
