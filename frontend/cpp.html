<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>C++ Runner</title>

    <link rel="stylesheet"
    href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

</head>

<body>

    <div class="editor-layout">

        <div class="sidebar">

            <div class="sidebar-icon">

                C++

            </div>

<a href="index.html" class="sidebar-logo">

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <polyline points="16 18 22 12 16 6"></polyline>
    <polyline points="8 6 2 12 8 18"></polyline>

</svg>

</a>

<a href="index.html" class="sidebar-home">

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M3 9.5L12 2l9 7.5"></path>
    <path d="M9 22V12h6v10"></path>

</svg>

</a>

        </div>

        <div class="main-editor">

            <div class="topbar">

                <span>

                    C++ Runner

                </span>

                <div id="execution-status">

                  Idle

                </div>

                <div class="topbar-buttons">

                    <button
                    id="run-btn"

                    onclick="runCode()">

                        ▶ Run

                    </button>

                    <button
                    id="save-btn"

                    onclick="saveFile()">

                        Save

                    </button>

<button id="download-btn">

    Download

</button>

<button id="upload-btn">

    Upload

</button>
<input

    type="file"

    id="file-input"

    style="display:none;"

/>

                </div>

            </div>

<div class="editor-tabs">

    <a href="python.html"
    class="tab-link">

        Python

    </a>

    <a href="javascript.html"
    class="tab-link">

        JavaScript

    </a>

    <a href="cpp.html"
    class="tab-link active-tab">

        C++

    </a>

    <a href="visual.html"
    class="tab-link">

        Visual

    </a>

</div>

            <div id="editor"></div>

            <div id="editor-loading">

              Loading editor...

            </div>

            <div id="output-container">

<div id="terminal-header">

    <span>
        TERMINAL
    </span>

    <button id="clear-terminal-btn">

        Clear

    </button>

</div>

                <pre id="output">
Ready.

Press Ctrl + Enter to run code.
                </pre>

            </div>

<div id="status-bar">

    <span id="current-file">

        📄 Untitled.cpp

    </span>

</div>

        </div>

    </div>

    <script src="editor-core.js"></script>

    <script src="cpp.js"></script>

</body>

</html>
