<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>
        Visual Playground
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>

</head>

<body>

    <div class="app-layout">




        <div class="sidebar">

<a href="index.html" class="sidebar-logo">

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <polyline points="16 18 22 12 16 6"></polyline>
    <polyline points="8 6 2 12 8 18"></polyline>

</svg>

</a>

<a href="index.html" class="sidebar-home">

<svg
    xmlns="http://www.w3.org/2000/svg"
    width="22"
    height="22"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M3 9.5L12 2l9 7.5"></path>
    <path d="M9 22V12h6v10"></path>

</svg>

</a>

        </div>





        <div class="main-content">





            <div class="topbar">

                <div class="topbar-left">

                    Visual Playground

                </div>

            </div>





            <div class="editor-tabs">

                <a
                    href="python.html"
                    class="tab-link"
                >
                    Python
                </a>

                <a
                    href="javascript.html"
                    class="tab-link"
                >
                    JavaScript
                </a>

                <a
                    href="cpp.html"
                    class="tab-link"
                >
                    C++
                </a>

                <a
                    href="visual.html"
                    class="tab-link active-tab"
                >
                    Visual
                </a>

            </div>






            <div class="visual-workspace">





                <div class="visual-editor">

                    <div id="editor-loading">

                        Loading editor...

                    </div>

                    <div id="editor"></div>

                </div>


                <div class="visual-preview">

                <div class="preview-header">

                   LIVE PREVIEW

                </div>

                    <iframe
                        id="preview-frame"
                    ></iframe>

                </div>





            </div>





        </div>




    </div>





    <script src="editor-core.js"></script>

    <script src="visual.js"></script>

</body>

</html>
